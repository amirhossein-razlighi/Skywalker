name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS (${{ matrix.preset }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan]
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: brew install ninja
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # Linux is not a target yet: the job keeps the portable core compiling with GCC; its tests
  # run once Linux support is taken on (a few image/persistence differences remain).
  headless-linux:
    name: Linux (headless build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libcurl4-openssl-dev
      - name: Configure
        run: cmake --preset headless
      - name: Build
        run: cmake --build --preset headless
