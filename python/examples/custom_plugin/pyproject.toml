[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sky-agents-hazards"
version = "0.1.0"
description = "Example skywalker-agents plugin: a hazard audit tool, a spend-limit hook, a fairness review pattern and a role."
requires-python = ">=3.10"
dependencies = ["skywalker-agents"]

# The whole integration is this entry point: skywalker-agents calls register(registry) once.
[project.entry-points."skywalker_agents.plugins"]
hazards = "sky_agents_hazards:register"

[tool.hatch.build.targets.wheel]
packages = ["src/sky_agents_hazards"]
